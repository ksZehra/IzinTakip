name: izintakip

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD .env dosyasında tanımlı olmalı (en az 8 karakter; büyük harf, küçük harf, rakam)}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"

  api:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: IzinTakip.Api/Dockerfile
    environment:
      ConnectionStrings__IzinTakip: "Server=sqlserver,1433;Database=IzinTakip;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      Database__MigrateOnStartup: "true"
      Seed__SuperAdmin__Eposta: ${SUPERADMIN_EPOSTA:-admin@izintakip.local}
      Seed__SuperAdmin__Parola: ${SUPERADMIN_PAROLA:-}
      Email__Host: mailpit
      Email__Port: "1025"
      Email__StartTls: "false"
      Uygulama__Adres: http://localhost:${GATEWAY_PORT:-8088}
    volumes:
      - api-belgeler:/app/belgeler
      - api-logs:/app/logs
    depends_on:
      sqlserver:
        condition: service_healthy
      mailpit:
        condition: service_started

  gateway:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/IzinTakip.Gateway/Dockerfile
    environment:
      Api__Adres: http://api:8080
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8088}:8080"
    volumes:
      - gateway-keys:/app/keys
      - gateway-logs:/app/logs
    depends_on:
      api:
        condition: service_started

volumes:
  sqlserver-data:
  api-belgeler:
  api-logs:
  gateway-keys:
  gateway-logs:
