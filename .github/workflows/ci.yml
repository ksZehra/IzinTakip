name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Docker build (api)
        run: docker build -f IzinTakip.Api/Dockerfile .

      - name: Docker build (gateway)
        working-directory: .
        run: docker build -f backend/IzinTakip.Gateway/Dockerfile .

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    env:
      MSSQL_SA_PASSWORD: Ci-Sql-${{ github.run_id }}-Aa1
      JWT_SIGNING_KEY: ci-jwt-imza-anahtari-${{ github.run_id }}-0123456789abcdef
      SUPERADMIN_PAROLA: CiAdmin${{ github.run_id }}Aa1
      DEMO_VERI: "true"
      DEMO_PAROLA: CiDemo${{ github.run_id }}Aa1
      E2E_PAROLA: CiDemo${{ github.run_id }}Aa1
      GIRIS_DAKIKADA_DENEME: "100"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start stack
        run: |
          docker compose --profile app up -d --build
          timeout 300 sh -c 'until [ "$(curl -s -o /dev/null -w %{http_code} -H X-CSRF:1 http://localhost:8088/api/auth/ben)" = 401 ]; do sleep 3; done'

      - name: Install
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Stack logs
        if: failure()
        run: docker compose --profile app logs api gateway
